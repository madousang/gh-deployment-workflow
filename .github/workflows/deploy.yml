name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
  # Lets you trigger a manual redeploy from the Actions tab if needed
  workflow_dispatch:

# Sets permissions for the GITHUB_TOKEN so this workflow can deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time, cancel in-progress runs if a newer one starts
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4